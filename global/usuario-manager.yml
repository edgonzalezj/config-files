# Configuracion comun de usuario-manager (todos los entornos)
server:
  port: 8082

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: teamclub
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never

internal:
  api-key: wakana-internal-key

teamclub:
  bootstrap:
    admin-email: admin@teamclub.com
    admin-password: admin
clients:
  auth-manager:
    url: http://localhost:8081
