# Configuracion especifica de club-manager
server:
  port: 8085

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: teamclub_club

  sql:
    init:
      data-locations: classpath:db/data.sql

  cloud:
    vault:
      kv:
        application-name: club-manager

management:
  endpoint:
    health:
      show-details: always

clients:
  team-masterdata:
    url: http://localhost:8083
