# Configuracion especifica de club-manager
server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=teamclub_club

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: teamclub_club

management:
  endpoint:
    health:
      show-details: always

# internal.api-key viene de Vault
