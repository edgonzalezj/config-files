# Configuración común para entorno PRE (Preproducción)
# Los secretos (username, password) vienen de Vault
spring:
  datasource:
    url: jdbc:postgresql://pre-db.teamclub.local:5432/teamclub_pre?currentSchema=teamclub
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: teamclub
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-manager:8081/.well-known/jwks.json

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
      fail-fast: true

logging:
  level:
    root: WARN
    com.wakana.teamclub: INFO
