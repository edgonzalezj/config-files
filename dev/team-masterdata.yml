# Perfil dev: conecta al Config Server (sin Vault, secretos directos)
server:
  port: 8083

spring:
  cloud:
    config:
      enabled: true
    vault:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=teamclub_masterdata
    username: postgres
    password: eduardo

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: teamclub_masterdata
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
