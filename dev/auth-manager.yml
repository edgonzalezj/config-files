# Perfil dev: conecta al Config Server y Vault para secretos
server:
  port: 8081

spring:
  config:
    import: "optional:vault://"
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN:teamclub-root-token}
      kv:
        enabled: true
        backend: secret
        default-context: auth-manager
        application-name: auth-manager
      fail-fast: false

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=teamclub_auth
    # username y password vienen de Vault

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: teamclub_auth
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info

# internal.api-key viene de Vault

security:
  jwt:
    issuer: wakana-teamclub-auth
    expires-minutes: 60
