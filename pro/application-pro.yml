# Configuración común para entorno PRO (Producción)
# Los secretos (username, password) vienen de Vault
spring:
  datasource:
    url: jdbc:postgresql://pro-db.teamclub.local:5432/teamclub?currentSchema=teamclub
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: teamclub
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-manager:8081/.well-known/jwks.json

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
      fail-fast: true

logging:
  level:
    root: WARN
    com.wakana.teamclub: WARN

management:
  endpoint:
    health:
      show-details: never
